[package]
name = "brian"
version = "0.0.0"
edition = "2024"
description = "Plano de controle de engenharia de IA — capacidade, custo e continuidade entre providers"
license = "MIT"
publish = false

[[bin]]
name = "brian"
path = "src/main.rs"

# Cada dependência entra na task que a exige, não antes.
[dependencies]
# "bundled": compila o SQLite junto, sem depender de lib do sistema (D-1).
rusqlite = { version = "0.32", features = ["bundled"] }
# Navegação seletiva via Value — sem derive, não precisamos de struct completa
# para ler 5 campos de um documento que tem dezenas.
serde_json = "1"
# Blueprint especifica clap para a CLI (BRIAN-BLUEPRINT-V1.md §52.1, D-2).
clap = { version = "4", features = ["derive"] }
