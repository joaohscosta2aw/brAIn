[package]
name = "brian"
version = "0.0.0"
edition = "2024"
description = "Plano de controle de engenharia de IA — capacidade, custo e continuidade entre providers"
license = "MIT"
publish = false

[[bin]]
name = "brian"
path = "src/main.rs"

# Cada dependência entra na task que a exige, não antes.
[dependencies]
# "bundled": compila o SQLite junto, sem depender de lib do sistema (D-1).
rusqlite = { version = "0.32", features = ["bundled"] }
